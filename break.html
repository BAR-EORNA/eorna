<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EORNA BREAK — BAR EORNA</title>
<meta name="description" content="BAR EORNAのブロック崩し。カウンターでボトルを崩そう。">
<meta name="theme-color" content="#0C0A08">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23B0281C%27/%3E%3Ctext x=%2732%27 y=%2746%27 font-family=%27Arial Black,sans-serif%27 font-size=%2740%27 font-weight=%27900%27 fill=%27%23EDE5D2%27 text-anchor=%27middle%27%3EE%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F4JBQ8GK16"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-F4JBQ8GK16');</script>
<style>
:root{--bg:#0C0A08;--panel:#15110D;--cream:#E9E3D3;--gold:#C9A96A;--red:#C1301F;--dim:#9a9081;--hair:rgba(233,227,211,.14);
--disp:'Anton',sans-serif;--mono:'Space Mono',monospace;--sans:'Noto Sans JP',sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--cream);font-family:var(--sans);display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none}
header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem}
.brand{font-family:var(--disp);font-size:1.05rem;letter-spacing:.1em}.brand b{color:var(--gold);font-weight:400}
header a{font-family:var(--mono);font-size:.58rem;letter-spacing:.2em;color:var(--dim);text-decoration:none;border:1px solid var(--hair);padding:.45rem .7rem;border-radius:999px}
header a:active{color:var(--gold);border-color:var(--gold)}
.hud{width:100%;max-width:480px;display:flex;justify-content:space-between;padding:0 1rem .3rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.15em;color:var(--dim)}
.hud b{color:var(--gold)}
#stage{position:relative;flex:1;width:100%;max-width:480px;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 .6rem .8rem}
canvas{background:linear-gradient(180deg,#110D0A,#0A0705);border:1px solid var(--hair);border-radius:14px;box-shadow:inset 0 2px 30px rgba(0,0,0,.6),0 20px 50px -30px #000;touch-action:none;max-height:100%}
#over{position:fixed;inset:0;z-index:10;background:rgba(8,6,4,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:2rem;transition:opacity .3s}
#over.off{opacity:0;pointer-events:none}
#over .k{font-family:var(--mono);font-size:.56rem;letter-spacing:.4em;color:var(--gold);text-transform:uppercase}
#over h1{font-family:var(--disp);font-size:clamp(2.6rem,14vw,4.6rem);line-height:.92;margin:.4rem 0 .3rem}
#over h1 b{color:var(--gold);font-weight:400}
#over .sub{font-family:var(--sans);color:var(--dim);font-size:.95rem;margin-bottom:1.6rem;max-width:22em;line-height:1.8}
#over .score{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;color:var(--cream);margin-bottom:1.4rem}
#over button{font-family:var(--disp);font-size:1.1rem;letter-spacing:.06em;color:var(--bg);background:var(--gold);border:0;padding:.9rem 2.2rem;border-radius:999px}
#over a{margin-top:1rem;font-family:var(--mono);font-size:.56rem;letter-spacing:.22em;color:var(--dim);text-decoration:none}
</style>
</head>
<body>
<header><div class="brand">EORNA <b>BREAK</b></div><a href="arcade.html">← ARCADE</a></header>
<div class="hud"><div>STAGE <b id="stage_n">1</b></div><div>SCORE <b id="score">0</b></div><div>BALL <b id="balls">3</b></div><div>BEST <b id="best">0</b></div></div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="over">
  <div class="k">Bar Eorna — A Small Game</div>
  <h1>EORNA <b>BREAK</b></h1>
  <div class="sub">カウンターでボールを打ち返し、棚のボトルを崩しましょう。画面を左右になぞってカウンターを動かします。</div>
  <div class="score" id="finalScore"></div>
  <button id="start">はじめる</button>
  <a href="arcade.html">ゲーム一覧へ</a>
</div>
<script>
(function(){
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var W,H,DPR=Math.min(devicePixelRatio||1,2);
var paddle,ball,bricks,cols,rows,score,balls,best,playing=false,launched=false;
var speedMul=1,startTime=0,stage=1;
var COLORS=['#C9A96A','#b9863b','#8C2B22','#3f5d3a','#7a3b1c','#a8842e'];
best=parseInt(localStorage.getItem('eornaBreakBest')||'0');document.getElementById('best').textContent=best;

function resize(){
 var s=document.getElementById('stage');
 var availW=s.clientWidth-2, availH=s.clientHeight-2;
 W=Math.min(availW,availH*0.72); H=Math.min(availH,W/0.72);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,1,1);
 if(paddle){paddle.w=W*0.2;paddle.y=H-30;}
}
function pattern(name,r,c,rows,cols){
 switch(name){
  case 'pyramid': return c>=Math.floor((cols-1)/2)-r && c<=Math.ceil((cols-1)/2)+r;
  case 'checker': return (r+c)%2===0;
  case 'fortress': return (r<2)||(c<1||c>cols-2)||(r>=rows-1);
  case 'hollow': return r===0||r===rows-1||c===0||c===cols-1;
  case 'diamond': var mc=(cols-1)/2, mr=(rows-1)/2; return Math.abs(c-mc)+Math.abs(r-mr)<=Math.max(mc,mr);
  case 'gaps': return !((c%3===1)&&(r%2===1));
  default: return true; // full
 }
}
var PATS=['full','pyramid','checker','hollow','fortress','diamond','gaps'];
function setupBricks(){
 var pname=PATS[(stage-1)%PATS.length];
 rows=Math.min(5+Math.floor((stage-1)/2),9); cols=7; bricks=[];
 var pad=6, bw=(W-pad*(cols+1))/cols, bh=Math.max(14,H*0.030), top=H*0.09;
 var hardChance=Math.min(0.08*(stage-1),0.4);
 for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
  if(!pattern(pname,r,c,rows,cols))continue;
  var hard = stage>=3 && Math.random()<hardChance;
  bricks.push({x:pad+c*(bw+pad),y:top+r*(bh+pad),w:bw,h:bh,c:hard?'#C9A96A':COLORS[r%COLORS.length],alive:true,hp:hard?2:1,hard:hard});
 }
}
function reset(full){
 resize();
 paddle={w:W*0.2,h:12,x:W/2-W*0.1,y:H-30,speed:0};
 if(full){stage=1;score=0;balls=3;}
 resetBall(); if(full){setupBricks();startTime=0;speedMul=1;}
 document.getElementById("stage_n").textContent=stage;
 document.getElementById('score').textContent=score;
 document.getElementById('balls').textContent=balls;
}
function resetBall(){launched=false;var sp=Math.max(4,W*0.011)*(1+(stage-1)*0.06);ball={x:paddle.x+paddle.w/2,y:paddle.y-10,r:Math.max(6,W*0.016),vx:0,vy:0,sp:sp};}
function launch(){if(launched)return;launched=true;if(!startTime)startTime=Date.now();var ang=(-Math.PI/2)+(Math.random()*0.6-0.3);ball.vx=Math.cos(ang)*ball.sp;ball.vy=Math.sin(ang)*ball.sp;}

function step(){
 if(!playing)return;
 if(launched){
  var elapsed=(Date.now()-startTime)/1000;
  speedMul=Math.min(1+elapsed*0.012,2.1);
  var target=Math.min(ball.sp*speedMul,W*0.028);
  var cur=Math.hypot(ball.vx,ball.vy)||1;var k=target/cur;ball.vx*=k;ball.vy*=k;
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-1;}
  if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx*=-1;}
  if(ball.y<ball.r){ball.y=ball.r;ball.vy*=-1;}
  // paddle
  if(ball.y+ball.r>=paddle.y && ball.y+ball.r<=paddle.y+paddle.h+8 && ball.x>=paddle.x-ball.r && ball.x<=paddle.x+paddle.w+ball.r && ball.vy>0){
   var hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2); // -1..1
   var ang=(-Math.PI/2)+hit*(Math.PI/3);
   var sp=Math.min(ball.sp*1.03, W*0.02);ball.sp=sp;
   ball.vx=Math.cos(ang)*sp;ball.vy=Math.sin(ang)*sp;
  }
  // bricks
  for(var i=0;i<bricks.length;i++){var b=bricks[i];if(!b.alive)continue;
   if(ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w && ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
    b.hp=(b.hp||1)-1; if(b.hp>0){ if(oy<ox)ball.vy*=-1;else ball.vx*=-1; flashes.push({x:ball.x,y:ball.y,a:1}); score+=2; document.getElementById('score').textContent=score; break; }
    b.alive=false;score+=10;document.getElementById('score').textContent=score;
    // bounce vertical mostly
    var ox=Math.min(Math.abs(ball.x-b.x),Math.abs(ball.x-(b.x+b.w)));
    var oy=Math.min(Math.abs(ball.y-b.y),Math.abs(ball.y-(b.y+b.h)));
    if(oy<ox)ball.vy*=-1;else ball.vx*=-1;
    flashes.push({x:ball.x,y:ball.y,a:1});
    break;
   }
  }
  if(ball.y-ball.r>H){ balls--;document.getElementById('balls').textContent=balls;
   if(balls<=0){gameOver(false);return;} resetBall(); }
  if(bricks.every(function(b){return !b.alive;})){ nextStage(); return; }
 }else{ ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-10; }
 draw(); requestAnimationFrame(step);
}
var flashes=[];
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
 ctx.clearRect(0,0,W,H);
 for(var i=0;i<bricks.length;i++){var b=bricks[i];if(!b.alive)continue;
  var g=ctx.createLinearGradient(0,b.y,0,b.y+b.h);g.addColorStop(0,'rgba(255,255,255,.18)');g.addColorStop(.3,b.c);g.addColorStop(1,'rgba(0,0,0,.25)');
  ctx.fillStyle=g;rr(b.x,b.y,b.w,b.h,4);ctx.fill();
 }
 // paddle (counter)
 var pg=ctx.createLinearGradient(0,paddle.y,0,paddle.y+paddle.h);pg.addColorStop(0,'#e9d9b0');pg.addColorStop(1,'#8a6a2e');
 ctx.fillStyle=pg;rr(paddle.x,paddle.y,paddle.w,paddle.h,6);ctx.fill();
 // ball
 var bg=ctx.createRadialGradient(ball.x-ball.r*.3,ball.y-ball.r*.3,ball.r*.2,ball.x,ball.y,ball.r);
 bg.addColorStop(0,'#fff');bg.addColorStop(.4,'#C9A96A');bg.addColorStop(1,'#8a6a2e');
 ctx.fillStyle=bg;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
 for(var f=flashes.length-1;f>=0;f--){var fl=flashes[f];ctx.fillStyle='rgba(201,169,106,'+(fl.a*.5)+')';ctx.beginPath();ctx.arc(fl.x,fl.y,ball.r*2*(1.4-fl.a),0,7);ctx.fill();fl.a-=.08;if(fl.a<=0)flashes.splice(f,1);}
 if(!launched){ctx.fillStyle='rgba(233,227,211,.5)';ctx.font='12px '+"'Space Mono',monospace";ctx.textAlign='center';ctx.fillText('タップで発射',W/2,paddle.y-30);}
 if(banner.a>0){ctx.fillStyle='rgba(201,169,106,'+banner.a+')';ctx.font='bold '+(W*0.09)+"px 'Anton',sans-serif";ctx.textAlign='center';ctx.fillText(banner.t,W/2,H*0.5);banner.a-=0.015;}
}
function nextStage(){
 stage++; balls=Math.min(balls+1,9); // reward: +1 ball
 document.getElementById('stage_n').textContent=stage;
 document.getElementById('balls').textContent=balls;
 setupBricks(); resetBall(); startTime=0; speedMul=1;
 // brief banner
 msgFlash('STAGE '+stage);
}
var banner={t:'',a:0};
function msgFlash(t){banner={t:t,a:1};}
function gameOver(win){
 playing=false;
 if(score>best){best=score;localStorage.setItem('eornaBreakBest',best);document.getElementById('best').textContent=best;}
 document.querySelector('#over .sub').textContent='STAGE '+stage+' まで到達。また一杯、いかがですか。';
 document.querySelector('#over h1').innerHTML='GAME <b>OVER</b>';
 document.getElementById('finalScore').textContent='SCORE '+score+'  /  BEST '+best;
 document.getElementById('start').textContent='もう一度';
 document.getElementById('over').classList.remove('off');
}
function start(){document.getElementById('over').classList.add('off');reset(true);playing=true;requestAnimationFrame(step);}

// input
function movePaddleTo(clientX){var rect=canvas.getBoundingClientRect();var x=(clientX-rect.left);paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));}
canvas.addEventListener('pointerdown',function(e){launch();movePaddleTo(e.clientX);});
canvas.addEventListener('pointermove',function(e){if(e.pressure>0||e.buttons||true)movePaddleTo(e.clientX);});
addEventListener('keydown',function(e){if(!playing)return;if(e.key==='ArrowLeft')paddle.x=Math.max(0,paddle.x-W*0.06);if(e.key==='ArrowRight')paddle.x=Math.min(W-paddle.w,paddle.x+W*0.06);if(e.key===' ')launch();});
document.getElementById('start').addEventListener('click',start);
addEventListener('resize',function(){resize();if(playing){setupBricks&&0;}});
reset(true);
})();
</script>
</body>
</html>
